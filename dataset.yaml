name: github-issues
description: Issues GitHub (React, TensorFlow, VS Code, Bitcoin, OpenCV) étiquetées bug / feature / question (NLBSE'24)
source:
  url: https://github.com/nlbse2024/issue-report-classification
  license: voir le fichier LICENSE du dépôt (à vérifier)
  citation: >-
    Kallis, R., Colavito, G., Al-Kaswan, A., Pascarella, L., Chaparro, O., Rani, P. (2024).
    The NLBSE'24 Tool Competition. NLBSE'24.

raw_path: data/raw/dataset.csv

target:
  column: issue_type
  positive_class: question

features:
  numeric:
    - title_len
    - body_len
    - n_code_blocks
  categorical:
    - repo
  text:
    - text

sensitive:
  - column: repo

metrics:
  primary: roc_auc
  promotion_threshold: 0.75
  cost_matrix:
    false_negative: 2
    false_positive: 1

split:
  test_size: 0.2
  random_state: 42
