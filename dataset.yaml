name: prompt-injection
description: Prompts étiquetés attaque (prompt injection ou jailbreak) / normal, fusion de deux jeux Hugging Face
source:
  url: https://huggingface.co/datasets/jackhhao/jailbreak-classification et https://huggingface.co/datasets/deepset/prompt-injections
  license: apache-2.0 pour les deux (d'après leurs pages Hugging Face)

raw_path: data/raw/dataset.csv

target:
  column: label
  positive_class: attack

features:
  numeric:
    - prompt_len
    - n_words
  categorical: []
  text:
    - prompt

# Mesurée, jamais apprise : permet de comparer les scores par source
sensitive:
  - column: source

metrics:
  primary: roc_auc
  promotion_threshold: 0.95   # entre les forêts peu profondes (0.92) et les meilleurs modèles (0.98)
  cost_matrix:
    false_negative: 5   # laisser passer une attaque coûte 5 fois plus
    false_positive: 1

split:
  test_size: 0.2
  random_state: 42
